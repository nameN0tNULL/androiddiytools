name: Cache Whisper Small Model

on:
  push:
    branches:
      - tool/whisper-model-cache
    paths:
      - .github/workflows/cache-whisper-model.yml
  workflow_dispatch:

jobs:
  fetch-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download official Whisper small Q5 model
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 --retry-delay 3 \
            -o ggml-small-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin
          sha256sum ggml-small-q5_1.bin | tee SHA256SUMS.txt

      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: whisper-small-q5
          path: |
            ggml-small-q5_1.bin
            SHA256SUMS.txt
          compression-level: 0
          retention-days: 1
