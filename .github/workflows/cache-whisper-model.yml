name: Cache Translator Python Deps

on:
  push:
    branches:
      - tool/whisper-model-cache
    paths:
      - .github/workflows/cache-whisper-model.yml
  workflow_dispatch:

jobs:
  fetch-deps:
    runs-on: ubuntu-24.04
    steps:
      - name: Download compatible wheels
        run: |
          set -euxo pipefail
          mkdir -p wheelhouse
          python -m pip download --no-deps "huggingface_hub==0.36.0" -d wheelhouse
          python -m pip download --no-deps "tokenizers==0.22.1" -d wheelhouse
          ls -lh wheelhouse
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: translator-python-deps
          path: wheelhouse
          compression-level: 0
          retention-days: 1
